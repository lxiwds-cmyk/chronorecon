[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronorecon"
version = "1.0.0"
description = "Multi-source historical URL enumeration and archived file recovery for authorized security testing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChronoRecon contributors" }]
keywords = [
    "bug-bounty",
    "reconnaissance",
    "wayback-machine",
    "common-crawl",
    "web-archive",
    "osint",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "tqdm>=4.62",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "build>=1.0"]

[project.scripts]
chronorecon = "chronorecon.cli:main"

[tool.setuptools]
packages = ["chronorecon", "chronorecon.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
